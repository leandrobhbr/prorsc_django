[project]
name = "calculadora-rsc-django"
version = "1.0.0"
description = "Calculadora RSC-TAE de livre acesso — backend em Django"
license = "GPL-2.0-or-later"
requires-python = ">=3.12"
dependencies = [
    "bcrypt>=5.0",
    # 5.2 é a versão LTS (suporte estendido até abril de 2028).
    "django>=5.2,<5.3",
    "django-cors-headers>=4.7",
    "djangorestframework>=3.16",
    "djangorestframework-simplejwt>=5.5",
    "gunicorn>=23.0",
    "hashids>=1.3",
    "python-dotenv>=1.0",
    "tzdata>=2025.1",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-django>=4.11",
    "ruff>=0.15",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings"
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["*/migrations/*"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
