# VirtualHost do Apache para a Calculadora RSC-TAE (Django).
# - "/"        → arquivos estáticos do frontend (resultado do "quasar build")
# - "/static/" → CSS/JS do Django Admin (resultado do "collectstatic")
# - "/api/" e "/admin/" → proxy reverso para o Gunicorn em 127.0.0.1:8003
#
# Instalação:
#   sudo cp deploy/apache/prorsc-django.conf /etc/apache2/sites-available/
#   sudo a2enmod proxy proxy_http headers
#   sudo a2ensite prorsc-django && sudo apache2ctl configtest && sudo systemctl reload apache2
#   sudo certbot --apache -d calculadora.exemplo.com.br   # HTTPS (cria o vhost :443)

<VirtualHost *:80>
    ServerName calculadora.exemplo.com.br

    DocumentRoot /var/www/prorsc-django
    <Directory /var/www/prorsc-django>
        Options -Indexes
        AllowOverride None
        Require all granted
    </Directory>

    # Arquivos do Django Admin servidos direto pelo Apache (não passam pelo Python).
    Alias /static/ /opt/prorsc-django/backend/staticfiles/
    <Directory /opt/prorsc-django/backend/staticfiles>
        Require all granted
    </Directory>

    ProxyPreserveHost On
    ProxyPass        /api/   http://127.0.0.1:8003/api/ timeout=60
    ProxyPassReverse /api/   http://127.0.0.1:8003/api/
    ProxyPass        /admin/ http://127.0.0.1:8003/admin/
    ProxyPassReverse /admin/ http://127.0.0.1:8003/admin/
    RequestHeader set X-Forwarded-Proto expr=%{REQUEST_SCHEME}

    Header always set X-Content-Type-Options "nosniff"
    Header always set X-Frame-Options "DENY"
    Header always set Referrer-Policy "strict-origin-when-cross-origin"

    <Files "index.html">
        Header set Cache-Control "no-cache"
    </Files>
    <Directory /var/www/prorsc-django/assets>
        Header set Cache-Control "public, max-age=31536000, immutable"
    </Directory>

    ErrorLog  ${APACHE_LOG_DIR}/prorsc-django-error.log
    CustomLog ${APACHE_LOG_DIR}/prorsc-django-access.log combined
</VirtualHost>
