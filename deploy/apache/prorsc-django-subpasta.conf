# Calculadora RSC-TAE (django) publicada em SUBPASTA de um domínio que já existe:
#   https://exemplo.com.br/prorsc_django/
#
# Não é um VirtualHost: este trecho entra DENTRO do <VirtualHost *:443> do domínio, por meio
# da linha abaixo (adicionada uma única vez no vhost):
#   IncludeOptional /etc/apache2/prorsc/*.conf
#
# Instalação:
#   sudo mkdir -p /etc/apache2/prorsc
#   sudo cp deploy/apache/prorsc-django-subpasta.conf /etc/apache2/prorsc/
#   sudo a2enmod proxy proxy_http headers
#   sudo apache2ctl configtest && sudo systemctl reload apache2
#
# No /etc/prorsc-django.env: FRONT_PUBLIC_PATH=/prorsc_django/ e FRONT_API_URL=/prorsc_django/api/v1

# Sem a barra final, os caminhos relativos do build quebrariam: /prorsc_django → /prorsc_django/
RedirectMatch 301 ^/prorsc_django$ /prorsc_django/

# API → Gunicorn. O Apache tira o prefixo: /prorsc_django/api/v1/... chega como /api/v1/...
# (ProxyPass tem prioridade sobre o Alias do frontend, mais abaixo.)
ProxyPass        /prorsc_django/api/ http://127.0.0.1:8003/api/ timeout=60
ProxyPassReverse /prorsc_django/api/ http://127.0.0.1:8003/api/

# Django Admin → Gunicorn (com FORCE_SCRIPT_NAME=/prorsc_django no .env, o Django gera os
# links e redirecionamentos já com o prefixo).
ProxyPass        /prorsc_django/admin/ http://127.0.0.1:8003/admin/
ProxyPassReverse /prorsc_django/admin/ http://127.0.0.1:8003/admin/

# CSS/JS do Admin (collectstatic) servidos direto pelo Apache. Este Alias precisa vir ANTES
# do Alias do frontend: o Apache usa o primeiro que casar.
Alias /prorsc_django/static/ /opt/prorsc-django/backend/staticfiles/
<Directory /opt/prorsc-django/backend/staticfiles>
    Options -Indexes
    Require all granted
</Directory>

<Location /prorsc_django/>
    # O backend recebe o domínio original no cabeçalho Host (e não 127.0.0.1).
    ProxyPreserveHost On
    # Informa ao backend que o acesso original foi por HTTPS.
    RequestHeader set X-Forwarded-Proto "https"
    Header always set X-Content-Type-Options "nosniff"
    Header always set X-Frame-Options "DENY"
    Header always set Referrer-Policy "strict-origin-when-cross-origin"
</Location>

# Frontend compilado (quasar build), copiado pelo deploy/atualizar.sh para o FRONT_DIR do
# .env. Se mudar o FRONT_DIR, troque o caminho nas linhas abaixo também.
Alias /prorsc_django/ /var/www/prorsc-django/
<Directory /var/www/prorsc-django>
    Options -Indexes
    AllowOverride None
    Require all granted
    <Files "index.html">
        Header set Cache-Control "no-cache"
    </Files>
</Directory>
<Directory /var/www/prorsc-django/assets>
    Header set Cache-Control "public, max-age=31536000, immutable"
</Directory>
